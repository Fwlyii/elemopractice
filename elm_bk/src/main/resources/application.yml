server:
  port: 8080

spring:
  application:
    name: elm
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${SPRING_DATASOURCE_URL:${DB_URL:jdbc:mysql://localhost:3306/elm_v2}}
    username: ${SPRING_DATASOURCE_USERNAME:${DB_USERNAME:root}}
    password: ${SPRING_DATASOURCE_PASSWORD:${DB_PASSWORD:}}


#  data:
#    redis:
#      host: 110.42.60.144
#      port: 6379
#      password: ${REDIS_PASSWORD:}
logging:
  level:
    org.springframework.jdbc.support.JdbcTransactionManager: debug

mybatis:
  configuration:
    #开启驼峰命名
    map-underscore-to-camel-case: true
  # 指定XML映射文件位置
  mapper-locations: classpath:com/tju/elm_bk/mapper/*.xml


jwt:
  # 本地演示兜底值仅用于开发；部署时请通过 JWT_SECRET 覆盖，并使用至少64字节随机密钥。
  secret: ${JWT_SECRET:elm-demo-development-secret-change-before-production-use-env-2026-09-03-please}
  token-validity-in-seconds: 86400
  token-validity-in-seconds-for-remember-me: 108000

# swagger
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui

# DeepSeek AI配置
deepseek:
  api-key: ${DEEPSEEK_API_KEY:}
  base-url: https://api.deepseek.com
  chat-endpoint: /chat/completions
  model: deepseek-chat
  max-tokens: 1024
  temperature: 0.7
  top-p: 0.9
  timeout-seconds: 30
  max-retries: 3
